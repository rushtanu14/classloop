services:
  gateway:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      clamav:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "8787"
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      CLAMD_TIMEOUT_MS: "15000"
      MAX_FILE_BYTES: "10485760"
      MAX_SIGNATURE_AGE_HOURS: "48"
      SCANNER_RATE_LIMIT_PER_MINUTE: "30"
      SCANNER_AUTH_TOKEN: "${SCANNER_AUTH_TOKEN:?Set SCANNER_AUTH_TOKEN to a random value of at least 32 characters}"
    ports:
      - "127.0.0.1:${SCANNER_HOST_PORT:-8787}:8787"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  clamav:
    # The base variant downloads current signatures before first clamd startup on a new volume.
    image: clamav/clamav:1.5.3_base
    # The official image currently publishes amd64 only. Docker Desktop emulates it on Apple silicon.
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - clamav_definitions:/var/lib/clamav
    mem_limit: 4g
    security_opt:
      - no-new-privileges:true

volumes:
  clamav_definitions:
